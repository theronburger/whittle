name: Whittle
options:
  bundleIdPrefix: com.theronburger
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  WhittleCore:
    path: .
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 3.1.0
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.19.6
targets:
  WhittleMac:
    type: application
    platform: macOS
    sources:
      - Apps/Shared
      - Apps/Mac
      - Assets/Assets.xcassets
      - path: Assets/ThirdPartyNotices.txt
        buildPhase: resources
    dependencies:
      - package: WhittleCore
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_NAME: Whittle
        PRODUCT_BUNDLE_IDENTIFIER: com.theronburger.whittle.mac
        INFOPLIST_FILE: Config/Mac-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Mac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    configFiles:
      Debug: Config/Local.xcconfig
      Release: Config/Local.xcconfig
  WhittlePad:
    type: application
    platform: iOS
    sources:
      - Apps/Shared
      - Apps/iPad
      - Assets/Assets.xcassets
    dependencies:
      - package: WhittleCore
    settings:
      base:
        PRODUCT_NAME: Whittle
        PRODUCT_BUNDLE_IDENTIFIER: com.theronburger.whittle.ipad
        INFOPLIST_FILE: Config/iPad-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/iPad.entitlements
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    configFiles:
      Debug: Config/Local.xcconfig
      Release: Config/Local.xcconfig
  WhittleMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/Mac
      - Apps/Shared
      - path: Apps/Mac
        excludes: [WhittleMacApp.swift]
    dependencies:
      - package: WhittleCore
      - package: KeyboardShortcuts
      - package: SnapshotTesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  WhittlePadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/iPad
        excludes: [__Snapshots__]
      - Apps/iPad/AnnotationRenderer.swift
      - Apps/iPad/CanvasController.swift
      - Apps/Shared/WhittleTheme.swift
      - Apps/Shared/ScreenshotLibrary.swift
    dependencies:
      - package: WhittleCore
      - package: SnapshotTesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  WhittleMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: Tests/MacUI
    dependencies:
      - target: WhittleMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WhittleMac
  WhittlePadUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: Tests/iPadUI
    dependencies:
      - target: WhittlePad
      - package: WhittleCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WhittlePad
schemes:
  WhittleMac:
    build:
      targets:
        WhittleMac: all
    test:
      gatherCoverageData: true
      targets:
        - WhittleMacTests
        - WhittleMacUITests
  WhittlePad:
    build:
      targets:
        WhittlePad: all
    test:
      gatherCoverageData: true
      targets:
        - WhittlePadTests
        - WhittlePadUITests
